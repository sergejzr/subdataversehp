[about]
heading = "Was ist DataPublication.nrw?"
text_1 = "Förderer, Verlage und Hochschulen erwarten zunehmend, dass Forschungsdaten nach den FAIR-Prinzipien veröffentlicht werden. Ein eigenes Repositorium aufzubauen und zu betreiben ist aber aufwendig, gerade für kleinere und mittelgroße Hochschulen."
text_2 = "DataPublication.nrw bündelt Technik, Qualitätssicherung und Beratung in einem Landesdienst. Jede Hochschule bekommt darin einen eigenen Bereich in ihrem Erscheinungsbild und bleibt mit ihren Daten sichtbar."
fact_1_title = "Landesdienst"
fact_1_text = "Gefördert vom Land NRW, getragen von der Universität Bonn gemeinsam mit der RWTH Aachen."
fact_2_title = "Open Source"
fact_2_text = "Grundlage ist Dataverse, eine international verbreitete Software für Forschungsdaten-Repositorien."
fact_3_title = "DOI für jeden Datensatz"
fact_3_text = "Veröffentlichte Daten bleiben dauerhaft auffindbar und zitierbar."
fact_4_title = "Vernetzt"
fact_4_text = "Die Daten liegen in DataStorage.nrw. Über eine Schnittstelle, die gerade entsteht, lässt sich künftig direkt aus Coscine.nrw veröffentlichen. Weitere Dienste lassen sich über die API anbinden."
fact_5_title = "Zentrale Qualitätssicherung"
fact_5_text = "Formale Prüfung, Review und Betreuung der Forschenden organisiert das Team in Bonn, mit möglichst wenig Mehraufwand für die Hochschulen."
fact_6_title = "Unterstützung aus Bonn"
fact_6_text = "Von der Einrichtung des Bereichs über Schulungen bis zum Support. Jede Hochschule entscheidet, wie viel sie selbst übernimmt."

[workflow]
heading = "Vom Datensatz zur Publikation"
lead = "Die vier Kacheln im Logo stehen für die vier Schritte einer Veröffentlichung."
collect = "Collect"
describe = "Describe"
publish = "Publish"
cite = "Cite"
collect_text = "Forschende stellen ihre Daten und die zugehörige Dokumentation zusammen und laden sie im Bereich ihrer Hochschule hoch."
describe_text = "Strukturierte Metadaten, eine Lizenz und eine Beschreibung machen den Datensatz auffindbar und nachnutzbar."
publish_text = "Vor der Veröffentlichung durchläuft der Datensatz eine formale Prüfung und ein Review. Bei Fragen hilft das Team von DataPublication.nrw."
cite_text = "Der Datensatz erhält einen DOI und eine Zitationsempfehlung. Spätere Änderungen erscheinen als neue Version."

[progress]
heading = "Stand des Aufbaus"
lead = "Seit Januar 2026 entsteht DataPublication.nrw. Für jede Partnerhochschule richten wir einen eigenen Bereich ein, zunächst auf dem Testsystem. Nach dem Start des Produktivbetriebs zeigt diese Seite auch die veröffentlichten Datensätze."
