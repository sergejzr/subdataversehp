[partners]
heading = "Partnerhochschulen"

[about]
heading = "Was ist DataPublication.nrw?"
text_1 = "Förderer, Verlage und Hochschulen erwarten zunehmend, dass Forschungsdaten nach den FAIR-Prinzipien veröffentlicht werden. Ein eigenes Repositorium aufzubauen und zu betreiben ist aber aufwendig, gerade für kleinere und mittelgroße Hochschulen."
text_2 = "DataPublication.nrw bündelt Technik, Qualitätssicherung und Beratung in einem Landesdienst. Jede Hochschule bekommt darin einen eigenen Bereich in ihrem Erscheinungsbild und bleibt mit ihren Daten sichtbar."
fact_1_title = "Landesdienst"
fact_1_text = "Gefördert vom Land NRW, getragen von der Universität Bonn gemeinsam mit der RWTH Aachen."
fact_2_title = "Open Source"
fact_2_text = "Grundlage ist Dataverse, eine international verbreitete Software für Forschungsdaten-Repositorien."
fact_3_title = "DOI für jeden Datensatz"
fact_3_text = "Veröffentlichte Daten bleiben dauerhaft auffindbar und zitierbar."
fact_4_title = "Vernetzt"
fact_4_text = "Die Daten liegen in DataStorage.nrw. Eine Schnittstelle zu Coscine.nrw wird entwickelt."

[workflow]
heading = "Vom Datensatz zur Publikation"
lead = "Die vier Kacheln im Logo stehen für die vier Schritte einer Veröffentlichung."
collect = "Collect"
describe = "Describe"
publish = "Publish"
cite = "Cite"
collect_text = "Forschende stellen ihre Daten und die zugehörige Dokumentation zusammen und laden sie im Bereich ihrer Hochschule hoch."
describe_text = "Strukturierte Metadaten, eine Lizenz und eine Beschreibung machen den Datensatz auffindbar und nachnutzbar."
publish_text = "Vor der Veröffentlichung wird der Datensatz formal geprüft. Jede Hochschule entscheidet, wie viel Kuratierung und Beratung sie selbst übernimmt."
cite_text = "Der Datensatz erhält einen DOI und eine Zitationsempfehlung. Spätere Änderungen erscheinen als neue Version."

[progress]
heading = "Stand des Aufbaus"
lead = "Seit Januar 2026 entsteht DataPublication.nrw. Für jede Partnerhochschule richten wir einen eigenen Bereich ein, zunächst auf dem Testsystem. Nach dem Start des Produktivbetriebs zeigt diese Seite auch die veröffentlichten Datensätze."
chart_title = "Eingerichtete Bereiche im Zeitverlauf"
table_date = "Datum"
table_count = "Eingerichtete Bereiche"
news_heading = "Neuigkeiten"
no_news = "Noch keine Neuigkeiten."
no_steps = "Noch keine Bereiche eingerichtet."
stand = "Stand"
no_date = "–"
table_toggle = "Daten als Tabelle"
big_label = "Bereiche eingerichtet"

[universities]
heading = "Beteiligte Hochschulen"
lead = "Zwölf Hochschulen haben schon in der Antragsphase ihre Beteiligung erklärt und gestalten den Aufbau mit. Die Universität Bonn und die RWTH Aachen tragen den Dienst und betreiben daneben eigene Repositorien. Weitere Hochschulen in NRW können später dazukommen."
map_label = "Karte der beteiligten Hochschulen in NRW"
list_heading = "Alle Hochschulen"
legend_heading = "Status"

[own_space]
heading = "Ein eigener Bereich für jede Hochschule"
lead = "Jede Hochschule erhält bei DataPublication.nrw eine eigene Startseite mit Logo, Farben und Schrift aus ihrem Corporate Design. Darunter lassen sich Fakultäten, Institute oder Projekte als Unterbereiche anlegen."
shots = ["fh-muenster", "hsbi", "fernuni-hagen"]
shot_alt = "Startseite des Bereichs der {name} bei DataPublication.nrw"
note = "Ansichten aus dem Testsystem"

[onboarding]
heading = "Der Weg zum eigenen Bereich"
lead = "So läuft die Einrichtung für die Partnerhochschulen ab. Hochschulen, die später dazukommen, durchlaufen dieselben Schritte."
step_1 = "Unterlagen"
step_1_text = "Die Hochschule schickt Logo, Corporate-Design-Leitfaden und eine Ansprechperson."
step_2 = "Entwurf"
step_2_text = "Wir richten den Bereich auf dem Testsystem ein und gestalten ihn nach dem Leitfaden."
step_3 = "Abnahme"
step_3_text = "Die Hochschule prüft den Entwurf. Wir arbeiten Änderungswünsche ein, danach gibt sie ihn frei."
step_4 = "Live"
step_4_text = "Mit dem Produktivbetrieb ist der Bereich öffentlich erreichbar und Forschende können veröffentlichen."
cta_text = "Ihre Hochschule möchte dabei sein?"
cta_link = "Schreiben Sie uns"

