explanation = "DataPublication.nrw ist ein gemeinsamer Dienst für die öffentlich-rechtlichen Hochschulen in Nordrhein-Westfalen. Forschende veröffentlichen hier ihre Daten mit DOI, gut beschrieben und dauerhaft zitierbar."
