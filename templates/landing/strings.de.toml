[universities]
heading = "Beteiligte Hochschulen"
lead = "Zwölf Hochschulen haben schon in der Antragsphase ihre Beteiligung erklärt und gestalten Workflows, Policies und Austauschformate mit. Die Universität Bonn und die RWTH Aachen tragen den Dienst und betreiben daneben eigene Repositorien."
map_label = "Karte der beteiligten Hochschulen in NRW"
list_heading = "Alle Hochschulen"
legend_heading = "Status"

[own_space]
heading = "Ein eigener Bereich für jede Hochschule"
lead = "Jede Hochschule erhält bei DataPublication.nrw eine eigene Startseite mit Logo, Farben und Schrift aus ihrem Corporate Design. Darunter lassen sich Fakultäten, Institute, Projekte oder thematische Communities als Unterbereiche anlegen."
shots = ["fh-muenster", "hsbi", "fernuni-hagen"]
shot_alt = "Startseite des Bereichs der {name} bei DataPublication.nrw"
note = "Ansichten aus dem Testsystem"

[onboarding]
heading = "Mitmachen"
lead = "DataPublication.nrw steht allen öffentlich-rechtlichen Hochschulen in Nordrhein-Westfalen offen, auch solchen mit eigenem Repositorium, etwa über Schnittstellen oder gemeinsame Veröffentlichungen. Wie weitere Hochschulen formal dazukommen, stimmen wir derzeit ab. Melden Sie sich gern schon jetzt: Wir nehmen Ihren Bedarf auf und melden uns, sobald der Weg feststeht."
step_1 = "Kontakt"
step_1_text = "Sie schreiben uns, wer an Ihrer Hochschule für das Forschungsdatenmanagement zuständig ist und was Sie vorhaben."
step_2 = "Bedarf klären"
step_2_text = "Gemeinsam klären wir, welche Daten veröffentlicht werden sollen und wie viel Beratung und Kuratierung Ihre Hochschule selbst übernimmt."
step_3 = "Rahmen abstimmen"
step_3_text = "Die rechtlichen und organisatorischen Grundlagen der Teilnahme, etwa Rollen und Verantwortlichkeiten, werden derzeit ausgearbeitet."
step_4 = "Eigener Bereich"
step_4_text = "Ihre Hochschule erhält einen Bereich in ihrem Erscheinungsbild, Ihr FDM-Team wird eingeführt und Forschende können veröffentlichen."
cta_text = "Ihre Hochschule möchte dabei sein oder hat Fragen?"
cta_link = "Schreiben Sie uns"

