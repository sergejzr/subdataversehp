# Showcase gallery in the "own space" section of the landing page.
# One table per area; the label is the folder name and URL slug under /at/.
# Order does not matter: the page sorts by display name, the demo area last.
#
#   released  required. false while the area has not agreed: shots.sh blurs
#             on capture, the tile shows without a link.
#   captured  date of the files in assets/shots/ (<label>.webp thumbnail,
#             <label>-full.webp full page), written by shots.sh
#   blurred   written by shots.sh. An unreleased area without blurred = true
#             gets the empty box, and its files are not published.
#
# Capture with tooling/landing-preview/shots.sh in the templates repo.
# A new area: add its table with released first, then run shots.sh.
# Not copied to the output.

[demo]
released = true  # our own area (FS3, FS4)
captured = 2026-10-30
blurred = false

