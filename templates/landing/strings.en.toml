[onboarding]
heading = "Get involved"
lead = "DataPublication.nrw is open to all public universities in North Rhine-Westphalia, including those with a repository of their own, for example through interfaces or joint publications. How further universities join formally is currently being agreed. Feel free to get in touch now: we will note your needs and come back to you as soon as the process is settled."
step_1 = "Contact"
step_1_text = "You name a contact person for DataPublication.nrw at your university and tell us what you have in mind."
step_2 = "Clarify needs"
step_2_text = "Together we clarify which data are to be published and how much advice and curation your university provides itself."
step_3 = "Agree the framework"
step_3_text = "The legal and organisational basis for taking part, such as roles and responsibilities, is currently being worked out."
step_4 = "Own space"
step_4_text = "Your university gets a space in its own corporate design, your contacts are introduced to the service and researchers can publish."
cta_text = "Would your university like to join, or do you have questions?"
cta_link = "Write to us"

[roadmap]
heading = "Timeline"
lead = "The state of North Rhine-Westphalia funds DataPublication.nrw from January 2026 to the end of 2029."
current_phase = 2
# Position of the arrow between the current and the next phase (0 to 1).
current_progress = 0.8
current_label = "We are here"
phase_1_when = "2025"
phase_1_title = "Concept and proposal"
phase_1_text = "Proposal within the state's digitalisation initiative, letters of intent from the participating universities."
phase_2_when = "2026"
phase_2_title = "Build-up"
phase_2_text = "Test and production systems, connection to FDM:Storage.nrw, quality processes, onboarding material and the spaces of the participating universities."
phase_3_when = "From go-live"
phase_3_title = "Operation and onboarding"
phase_3_text = "First publications, support for the universities, onboarding of further universities."
phase_4_when = "Until end of 2029"
phase_4_title = "Evaluation and establishment"
phase_4_text = "External evaluation and establishing the service at the universities. A second project phase is planned from 2030."

