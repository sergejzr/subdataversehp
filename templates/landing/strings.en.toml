nav_contact = "Contact"
logo_alt = "DataPublication.nrw – back to top"

[hero]
eyebrow = "Connecting Research Data Across NRW"
claim = "The statewide research data repository for North Rhine-Westphalia"
explanation = "DataPublication.nrw is a shared service for the public universities in North Rhine-Westphalia. Researchers publish their data here with a DOI, curated and citable for the long term."
status_line = "Technically ready · Spaces for the participating universities are being set up"
counter = "{n} of {total} university spaces set up"
link_universities = "Universities involved"
link_contact = "Get in touch"

[partners]
heading = "Participating universities"

[about]
heading = "What is DataPublication.nrw?"
text_1 = "Funders, publishers and universities increasingly expect research data to be published according to the FAIR principles. Building and running a repository of one's own takes a lot of effort, especially for small and medium-sized universities."
text_2 = "DataPublication.nrw combines infrastructure, quality assurance and advice in one statewide service. Each university gets its own space in its own corporate design and stays visible with its data."
# {services} and {concept} become links (services_*, concept_*).
text_3 = "DataPublication.nrw is one of the {services} and part of the {concept}. Together they support researchers through the whole research data lifecycle."
services_link = "statewide research data management services in NRW (in German)"
services_url = "https://www.fdm.nrw/technische-fdm-landesdienste"
concept_link = "state concept for research data management of DH.NRW (in German)"
concept_url = "https://doi.org/10.5281/zenodo.11242682"
# Figure from https://www.fdm.nrw/technische-fdm-landesdienste (FDL_LaDi_09-2026-1.png), CC BY 4.0, unchanged apart from size and format.
figure_alt = "Circular diagram “Infrastructures for research data” (in German). In the centre the research data lifecycle with project planning, collection and generation, analysis and processing, access and discoverability, archiving, and publication and reuse. Around it the statewide services DataPublication.nrw, git.nrw, Coscine, FDM:Storage.nrw with DataStorage.nrw and DataArchive.nrw, JupyterHub.nrw, sciebo and LZV.nrw."
figure_caption = "Statewide research data management services along the research data lifecycle."
figure_credit = "Figure:"
figure_source_url = "https://www.fdm.nrw/technische-fdm-landesdienste"
figure_license_url = "https://creativecommons.org/licenses/by/4.0/deed.en"
fact_1_title = "Statewide service"
fact_1_text = "Funded by the state of North Rhine-Westphalia, run by the University of Bonn together with RWTH Aachen University."
fact_2_title = "Open source"
fact_2_text = "Built on Dataverse, research data repository software used by institutions around the world."
fact_3_title = "A DOI for every dataset"
fact_3_text = "Published data stay findable and citable for the long term."
fact_4_title = "Connected"
fact_4_text = "Data are stored in FDM:Storage.nrw. An interface now being built will let researchers publish directly from Coscine. Further services can connect through the API."
fact_5_title = "Central quality assurance"
fact_5_text = "The team in Bonn organises formal checks, review and support for researchers, with as little extra work for the universities as possible."
fact_6_title = "Support from Bonn"
fact_6_text = "From setting up the space to training and support. Each university decides how much it takes on itself."

[workflow]
heading = "From dataset to publication"
collect = "Collect"
describe = "Describe"
publish = "Publish"
cite = "Cite"
collect_text = "Researchers put together their data and documentation and upload them to their university's space."
describe_text = "Structured metadata, a licence and a description make the dataset findable and reusable."
publish_text = "Before publication, each dataset goes through a formal check and a review. The DataPublication.nrw team helps with any questions."
cite_text = "The dataset receives a DOI and a suggested citation. Later changes are published as a new version."

[progress]
heading = "Progress"
lead = "DataPublication.nrw has been under construction since January 2026. We are setting up a space for each participating university, first on the test system. Once the service is in production, this page will also show the published datasets."
