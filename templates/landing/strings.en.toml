phase_2_when = "2026"
phase_2_title = "Build-up"
phase_2_text = "Test and production systems, connection to DataStorage.nrw, quality processes, onboarding material and the spaces of the partner universities."
phase_3_when = "From go-live"
phase_3_title = "Operation and onboarding"
