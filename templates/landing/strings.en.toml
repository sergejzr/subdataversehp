# All visible texts of the landing page (English).
# Keys must match strings.de.toml, otherwise the preview is skipped.

date_format = "%d %b %Y"
title = "DataPublication.nrw · Statewide research data repository"
description = "DataPublication.nrw is the statewide research data repository for universities in North Rhine-Westphalia. This page shows the current state of the build-up, the participating universities and whom to contact."
skip_link = "Skip to content"
lang_switch = "Deutsch"
lang_switch_lang = "de"

[status]
partner = "participating university"
external = "consortium partner"

[status_desc]
partner = "Gets a space of its own at DataPublication.nrw."
external = "Runs the DataPublication.nrw service."

[header]
