[header]
wordmark = "DataPublication.nrw"
nav_label = "Main navigation"
nav_about = "Service"
nav_progress = "Progress"
nav_universities = "Universities"
nav_contact = "Contact"
logo_alt = "DataPublication.nrw – back to top"

[hero]
eyebrow = "Connecting Research Data Across NRW"
claim = "The statewide research data repository for North Rhine-Westphalia"
explanation = "DataPublication.nrw is a shared service for the public universities in North Rhine-Westphalia. Researchers publish their data here with a DOI, well described and citable for the long term."
status_line = "Technically ready · Spaces for the partner universities are being set up"
counter = "{n} of {total} university spaces set up"
link_universities = "Participating universities"
link_contact = "Get in touch"

[partners]
heading = "Partner universities"

[about]
heading = "What is DataPublication.nrw?"
text_1 = "Funders, publishers and universities increasingly expect research data to be published according to the FAIR principles. Building and running a repository of one's own takes a lot of effort, especially for small and medium-sized universities."
text_2 = "DataPublication.nrw combines infrastructure, quality assurance and advice in one statewide service. Each university gets its own space in its own corporate design and stays visible with its data."
fact_1_title = "Statewide service"
fact_1_text = "Funded by the state of North Rhine-Westphalia, run by the University of Bonn together with RWTH Aachen University."
fact_2_title = "Open source"
fact_2_text = "Built on Dataverse, research data repository software used by institutions around the world."
fact_3_title = "A DOI for every dataset"
fact_3_text = "Published data stay findable and citable for the long term."
fact_4_title = "Connected"
fact_4_text = "Data are stored in DataStorage.nrw. An interface to Coscine.nrw is under development."

[workflow]
heading = "From dataset to publication"
lead = "The four tiles in the logo stand for the four steps of a publication."
collect = "Collect"
describe = "Describe"
publish = "Publish"
cite = "Cite"
collect_text = "Researchers put together their data and documentation and upload them to their university's space."
describe_text = "Structured metadata, a licence and a description make the dataset findable and reusable."
publish_text = "Each dataset is checked formally before it is published. Every university decides how much curation and advice it provides itself."
cite_text = "The dataset receives a DOI and a suggested citation. Later changes are published as a new version."

[progress]
heading = "Progress"
lead = "DataPublication.nrw has been under construction since January 2026. We are setting up a space for each partner university, first on the test system. Once the service is in production, this page will also show the published datasets."
chart_title = "University spaces set up over time"
table_date = "Date"
table_count = "Spaces set up"
news_heading = "News"
no_news = "No news yet."
no_steps = "No spaces set up yet."
stand = "As of"
no_date = "–"
table_toggle = "Show data as a table"
big_label = "spaces set up"

[universities]
heading = "Participating universities"
lead = "Twelve universities declared their participation during the proposal phase and help shape the service. The University of Bonn and RWTH Aachen University run the service and also operate repositories of their own. Further universities in North Rhine-Westphalia can join later."
map_label = "Map of the participating universities in North Rhine-Westphalia"
list_heading = "All universities"
legend_heading = "Status"

[own_space]
heading = "A space of its own for every university"
lead = "Each university gets its own start page at DataPublication.nrw, with the logo, colours and typeface of its corporate design. Faculties, institutes or projects can have sub-spaces of their own below it."
shots = ["fh-muenster", "hsbi", "fernuni-hagen"]
shot_alt = "Start page of the {name} space at DataPublication.nrw"
note = "Views from the test system"

[onboarding]
heading = "How a university gets its space"
lead = "This is how the partner universities are set up. Universities that join later go through the same steps."
step_1 = "Material"
step_1_text = "The university sends its logo, its corporate design guide and a contact person."
step_2 = "Draft"
step_2_text = "We set up the space on the test system and design it according to the guide."
step_3 = "Approval"
step_3_text = "The university reviews the draft. We work in requested changes, then the university approves it."
step_4 = "Live"
step_4_text = "Once the service is in production, the space is public and researchers can publish."
cta_text = "Would your university like to join?"
cta_link = "Write to us"

[roadmap]
heading = "Timeline"
lead = "The state of North Rhine-Westphalia funds DataPublication.nrw from January 2026 to the end of 2029."
current_phase = 2
current_label = "We are here"
phase_1_when = "2025"
phase_1_title = "Concept and proposal"
phase_1_text = "Proposal within the state's digitalisation initiative, letters of intent from the partner universities."
phase_2_when = "2026"
phase_2_title = "Build-up"
phase_2_text = "Test and production systems, connection to DataStorage.nrw, spaces for the partner universities."
phase_3_when = "From go-live"
phase_3_title = "Operation and onboarding"
phase_3_text = "First publications, support for the universities, onboarding of further universities."
phase_4_when = "Until end of 2029"
phase_4_title = "Evaluation and long-term operation"
phase_4_text = "External evaluation and a model for running the service permanently."

[contact]
heading = "Contact"
lead = "The DataPublication.nrw team at the University of Bonn answers questions about the service, about your university taking part, or about the state of the project."
