no_date = "–"
table_toggle = "Show data as a table"
big_label = "spaces set up"

[universities]
heading = "Participating universities"
lead = "Twelve universities declared their participation during the proposal phase and help shape workflows, policies and exchange formats. The University of Bonn and RWTH Aachen University run the service and also operate repositories of their own."
map_label = "Map of the participating universities in North Rhine-Westphalia"
list_heading = "All universities"
legend_heading = "Status"

[own_space]
heading = "A space of its own for every university"
lead = "Each university gets its own start page at DataPublication.nrw, with the logo, colours and typeface of its corporate design. Faculties, institutes, projects or thematic communities can have sub-spaces of their own below it."
shots = ["fh-muenster", "hsbi", "fernuni-hagen"]
shot_alt = "Start page of the {name} space at DataPublication.nrw"
note = "Views from the test system"

[onboarding]
heading = "Get involved"
lead = "DataPublication.nrw is open to all public universities in North Rhine-Westphalia, including those with a repository of their own, for example through interfaces or joint publications. How further universities join formally is currently being agreed. Feel free to get in touch now: we will note your needs and come back to you as soon as the process is settled."
step_1 = "Contact"
step_1_text = "You tell us who is responsible for research data management at your university and what you have in mind."
step_2 = "Clarify needs"
step_2_text = "Together we clarify which data are to be published and how much advice and curation your university provides itself."
step_3 = "Agree the framework"
step_3_text = "The legal and organisational basis for taking part, such as roles and responsibilities, is currently being worked out."
step_4 = "Own space"
step_4_text = "Your university gets a space in its own corporate design, your RDM team is introduced to the service and researchers can publish."
cta_text = "Would your university like to join, or do you have questions?"
cta_link = "Write to us"

[roadmap]
heading = "Timeline"
lead = "The state of North Rhine-Westphalia funds DataPublication.nrw from January 2026 to the end of 2029."
current_phase = 2
